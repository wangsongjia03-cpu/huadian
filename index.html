<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f7fb" />
    <meta name="description" content="上传照片，写下寄语，生成你的华电迎新纪念卡。" />
    <title>华电迎新纪念卡</title>
    <link rel="stylesheet" href="./styles.css?v=19" />
  </head>
  <body>
    <main class="page-shell">
      <section id="editorPage" class="page editor-page">
        <header class="hero">
          <span class="eyebrow">新人专属纪念卡</span>
          <h1>定格你的入职青春瞬间</h1>
          <p>选择一张照片，拖动调整裁切后，再写下想对未来说的话。</p>
        </header>

        <section class="panel preview-panel">
          <div class="section-heading">
            <div><span class="step-label">01</span><h2>调整照片</h2></div>
            <label class="text-button" for="photoInput"><span id="chooseText">选择照片</span></label>
          </div>

          <div class="card-stage">
            <div id="cardPreview" class="card-preview" aria-label="纪念卡预览">
              <img class="card-layer card-background" src="./card-background.png" alt="" />
              <div class="photo-mat"></div>

              <label id="photoWindow" class="photo-window photo-window-empty" for="photoInput">
                <img id="editablePhoto" class="editable-photo" alt="已选择的照片" draggable="false" />
                <span id="photoPlaceholder" class="photo-placeholder">
                  <span class="photo-placeholder-plus">＋</span>
                  <span>点击选择入职照片</span>
                </span>
              </label>

              <img class="card-layer card-overlay" src="./card-overlay.png" alt="" />
              <div id="messagePreview" class="message-preview">希望你能在每一个轰鸣的夜里，把“熬过去”过成“守得住”。</div>
            </div>
          </div>

          <input id="photoInput" class="visually-hidden" type="file" accept="image/*" />

          <div id="photoToolbar" class="photo-toolbar" hidden>
            <button id="zoomOutButton" class="tool-button" type="button">缩小</button>
            <button id="zoomInButton" class="tool-button" type="button">放大</button>
            <button id="resetButton" class="tool-button" type="button">复位</button>
          </div>
        </section>

        <section class="panel input-panel">
          <div class="section-heading">
            <div><span class="step-label">02</span><h2>填写卡片寄语</h2></div>
            <span id="characterCount" class="character-count">28 / 30</span>
          </div>

          <textarea
            id="messageInput"
            maxlength="30"
            rows="4"
            placeholder="例如：希望你能在每一个轰鸣的夜里，把‘熬过去’过成‘守得住’。"
          >希望你能在每一个轰鸣的夜里，把“熬过去”过成“守得住”。</textarea>

          <div class="color-row">
            <span class="field-label">文字颜色</span>
            <div id="colorOptions" class="color-options" role="radiogroup" aria-label="文字颜色">
              <button class="color-chip selected" type="button" data-color="#173B89" role="radio" aria-checked="true">
                <span class="color-dot" style="background:#173B89"></span>天蓝色
              </button>
              <button class="color-chip" type="button" data-color="#0A285C" role="radio" aria-checked="false">
                <span class="color-dot" style="background:#0A285C"></span>海蓝色
              </button>
              <button class="color-chip" type="button" data-color="#C94444" role="radio" aria-checked="false">
                <span class="color-dot" style="background:#C94444"></span>暖心红
              </button>
            </div>
          </div>
        </section>

        <button id="generateButton" class="primary-button generate-button" type="button">生成我的迎新纪念卡</button>
        <p class="privacy-note">照片和文字只在当前设备中用于生成卡片，不会上传到服务器。</p>
      </section>

      <section id="resultPage" class="page result-page" hidden>
        <header class="result-heading">
          <span class="eyebrow">生成完成</span>
          <h1>你的华电迎新纪念卡</h1>
          <p>微信内请长按图片并选择“保存到手机”；其他浏览器也可以点击“下载高清图片”。</p>
        </header>

        <div class="result-card">
          <img id="resultImage" alt="生成的华电迎新纪念卡" />
        </div>

        <div class="result-actions">
          <button id="editButton" class="secondary-button" type="button">重新编辑</button>
          <button id="downloadButton" class="primary-button" type="button">保存高清图片</button>
        </div>
        <button id="shareButton" class="share-button" type="button">分享制作链接</button>
        <p class="result-tip">在微信中请直接长按卡片，再选择“保存到手机”。如果仍被微信拦截，可点右上角菜单并选择“在浏览器打开”，然后点击保存按钮。</p>
      </section>
    </main>

    <div id="generatingMask" class="generating-mask" hidden>
      <div class="generating-dialog" role="status" aria-live="polite">
        <div class="train-dots"><i></i><i></i><i></i></div>
        <strong>正在驶向中国华电……</strong>
        <span>正在生成你的入职纪念卡</span>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <canvas id="posterCanvas" width="1228" height="1608" hidden></canvas>
    <script src="./app.js?v=19"></script>
  </body>
</html>
